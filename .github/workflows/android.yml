name: Android APK

on:
  push:
    branches: [ main, master, android, android-port ]
    paths: [ 'apps/android/**', 'libs/**', 'vendor/**', 'CMakeLists.txt', '.github/workflows/android.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK, CMake and platform
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.31.6" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Install DXC (HLSL to SPIR-V shader compiler)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R microsoft/DirectXShaderCompiler -p 'linux_dxc_*.tar.gz' -D /tmp/dxc
          sudo mkdir -p /opt/dxc && sudo tar -xzf /tmp/dxc/linux_dxc_*.tar.gz -C /opt/dxc
          echo "/opt/dxc/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=/opt/dxc/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          /opt/dxc/bin/dxc --version || true

      - name: Restore signing key (same key across builds so new APKs install over old ones)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: gbsat-signing-key-v1

      - name: Create sideload signing key (debug keystore)
        run: |
          mkdir -p ~/.android
          [ -f ~/.android/debug.keystore ] || keytool -genkeypair -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build release APK
        working-directory: apps/android
        run: |
          set +e
          gradle --no-daemon assembleRelease --stacktrace > build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            msg=$( (grep -E "^e: " build.log | cut -c1-400; grep -nE "error:|error\\b|FAILED|What went wrong|Caused by|undefined|CMake Error" -A3 build.log | head -80) | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Build errors::$msg"
          fi
          tail -60 build.log
          exit $rc

      - name: Name APK with version
        id: ver
        run: |
          VER=$(tr -d '[:space:]' < apps/android/VERSION)
          NAME="GBSat-v${VER}-build${GITHUB_RUN_NUMBER}"
          cd apps/android/app/build/outputs/apk/release
          mv *.apk "${NAME}.apk"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "::notice title=APK::${NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.name }}
          path: apps/android/app/build/outputs/apk/release/*.apk

      # A release is published once per version: when apps/android/VERSION changes to a version that has no release yet,
      # this build is published as release v<version> with the APK named GBSat-v<version>.apk and the matching
      # CHANGELOG.md section as release notes.
      - name: Publish release for a new version
        if: github.ref == 'refs/heads/android-port'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(tr -d '[:space:]' < apps/android/VERSION)
          if gh release view "v${VER}" >/dev/null 2>&1; then
            echo "Release v${VER} already exists; nothing to publish"
            exit 0
          fi
          cp "apps/android/app/build/outputs/apk/release/${{ steps.ver.outputs.name }}.apk" "GBSat-v${VER}.apk"
          awk -v ver="$VER" '
            /^## / { if (found) exit; if (index($0, "## " ver) == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "GBSat ${VER}" > notes.md
          gh release create "v${VER}" "GBSat-v${VER}.apk" --target "$GITHUB_SHA" --title "GBSat ${VER}" --notes-file notes.md
          echo "::notice title=Release::Published v${VER}"
