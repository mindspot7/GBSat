name: Vulkan shader check

# Development workflow for the Vulkan renderer: verifies that the VDP HLSL compute shaders compile to SPIR-V
# and validate for Vulkan 1.1/1.2 on a Linux host. Run manually.
on:
  workflow_dispatch:
  push:
    branches: [ android-port, vulkan, debug-states ]
    paths: [ '.github/workflows/vulkan-dev.yml', 'cmake/**', 'libs/gbsat-core/res/shaders/**', 'libs/gbsat-core/src/ymir/gpu/**', 'libs/gbsat-core/src/ymir/hw/vdp/renderer/vulkan/**', 'libs/gbsat-core/include/ymir/hw/vdp/renderer/vulkan/**', 'apps/vk-test/**', 'apps/android/app/src/main/cpp/serdes/**', 'libs/gbsat-core/src/ymir/hw/vdp/renderer/**', 'libs/gbsat-core/include/ymir/hw/vdp/**' ]

jobs:
  shaders:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build clang libvulkan-dev spirv-tools mesa-vulkan-drivers vulkan-validationlayers vulkan-tools
          gh release download -R microsoft/DirectXShaderCompiler -p 'linux_dxc_*.tar.gz' -D /tmp/dxc
          mkdir -p /opt/dxc && tar -xzf /tmp/dxc/linux_dxc_*.tar.gz -C /opt/dxc
          ls /opt/dxc /opt/dxc/bin
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Configure and build shaders
        run: |
          set +e
          export LD_LIBRARY_PATH=/opt/dxc/lib:$LD_LIBRARY_PATH
          export PATH=/opt/dxc/bin:$PATH
          dxc --version
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DYmir_LIBRARY_ONLY=ON -DYmir_DEV_BUILD=OFF \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ > cfg.log 2>&1
          rc=$?
          [ $rc -eq 0 ] && ninja -C build ymir-core-shaders > bld.log 2>&1 ; rc=$?
          cat cfg.log bld.log > all.log 2>/dev/null
          find build -name '*.spv' | head -50
          if [ $rc -ne 0 ]; then
            msg=$( (grep -nE "error|Error|FAILED|warning: .*int64|Could NOT" -A2 all.log | head -60) | cut -c1-300 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Shader build failed::$msg"
            exit $rc
          fi
          for f in $(find build -name '*.spv'); do
            spirv-val --target-env vulkan1.2 --scalar-block-layout "$f" > val.log 2>&1 || { echo "::error title=spirv-val failed::$f $(head -c 500 val.log)"; }
          done
          echo "SPV count: $(find build -name '*.spv' | wc -l)"
          for f in $(find build -name '*.spv' | head -3); do echo "== $f"; spirv-dis "$f" | grep -E "OpCapability|OpExtension" | sort -u | tr '\n' ' '; echo; done > caps.log
          for f in $(find build -name '*.spv' | sort); do echo "== $(basename $f)"; spirv-dis "$f" | grep -E "OpName %g_|OpName %type|OpDecorate %g_[A-Za-z]* (Binding|DescriptorSet)|OpDecorate %[A-Za-z_]* (Binding|DescriptorSet)|OpExtension|OpCapability|OpMemoryModel|OpEntryPoint|OpExecutionMode" | sed 's/  */ /g' | head -60; done > binds.log
          echo "::notice title=SPIR-V bindings::$(head -c 60000 binds.log | sed 's/%/%25/g;s/\r/%0D/g;:a;N;$!ba;s/\n/%0A/g')"
          echo "::notice title=SPIR-V capabilities::$(cat caps.log | sed ':a;N;$!ba;s/\n/%0A/g')"

      - name: Create compute pipelines for all shaders (lavapipe)
        run: |
          set +e
          g++ -std=c++20 -Ilibs/gbsat-core/include apps/vk-test/vk_pipeline_test.cpp -o vkt -lvulkan > vkt_build.log 2>&1
          if [ $? -ne 0 ]; then echo "::error title=vk test build failed::$(head -c 1500 vkt_build.log | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; fi
          VK_ICD_FILENAMES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1) ./vkt build > vkt.log 2>&1
          rc=$?
          echo "::notice title=Pipeline test (rc=$rc)::$(head -c 6000 vkt.log | sed ':a;N;$!ba;s/\n/%0A/g')"
          exit $rc

      - name: Compare software and Vulkan VDP renderers (lavapipe)
        run: |
          set +e
          export LD_LIBRARY_PATH=/opt/dxc/lib:$LD_LIBRARY_PATH
          export PATH=/opt/dxc/bin:$PATH
          cmake -S apps/vk-test -B vkt-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ > vkt_cfg.log 2>&1 && \
          ninja -C vkt-build vdp_compare > vkt_bld.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            cat vkt_cfg.log vkt_bld.log > vkt_all.log
            msg=$( (grep -nE "error|Error|FAILED" -A3 vkt_all.log | head -80) | cut -c1-400 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=vdp_compare build failed::$msg"
            exit $rc
          fi
          export VK_ICD_FILENAMES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          export VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation
          timeout 600 ./vkt-build/vdp_compare > cmp.log 2>&1
          rc=$?
          grep -c "Validation Error" cmp.log > /dev/null && echo "::warning title=Validation errors::$(grep -m 15 'Validation Error' cmp.log | cut -c1-600 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
          echo "::notice title=VDP compare (rc=$rc)::$(grep -v 'Validation' cmp.log | head -c 60000 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
          exit 0

      - name: Software renderer fast path matches the per-dot path
        run: |
          ninja -C vkt-build sw_fastpath_test > swt_bld.log 2>&1 || { echo "::error title=sw_fastpath_test build failed::$(grep -m 20 -E 'error' swt_bld.log | cut -c1-400 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"; exit 1; }
          timeout 900 ./vkt-build/sw_fastpath_test 400 > swt.log 2>&1
          rc=$?
          echo "::notice title=Software fast path test (rc=$rc)::$(tail -c 4000 swt.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
          exit $rc

      - name: Chained SH-2 interpreter matches the plain one
        run: |
          ninja -C vkt-build sh2_chain_test > sht_bld.log 2>&1 || { echo "::error title=sh2_chain_test build failed::$(grep -m 20 -E 'error' sht_bld.log | cut -c1-400 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"; exit 1; }
          timeout 900 ./vkt-build/sh2_chain_test 500 > sht.log 2>&1
          rc=$?
          echo "::notice title=SH-2 chained interpreter test (rc=$rc)::$(tail -c 4000 sht.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
          exit $rc

      - name: Compare renderers with resolution scaling (lavapipe)
        run: |
          set +e
          export VK_ICD_FILENAMES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          export VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation
          for sc in 2 3 4; do
            RES_SCALE=$sc timeout 900 ./vkt-build/vdp_compare > cmp$sc.log 2>&1
            rc=$?
            grep -q "Validation Error" cmp$sc.log && echo "::warning title=Validation errors (${sc}x)::$(grep -m 15 'Validation Error' cmp$sc.log | cut -c1-600 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
            echo "::notice title=VDP compare ${sc}x (rc=$rc)::$(grep -v 'Validation' cmp$sc.log | grep -E 'SCENE|RESULT|differ|scale|mismatch|failed' | head -c 20000 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
          done
          exit 0

      - name: Compare renderers on uploaded save states (apps/vk-test/states)
        if: hashFiles('apps/vk-test/states/*.state') != ''
        run: |
          set +e
          export VK_ICD_FILENAMES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          for f in apps/vk-test/states/*.state; do
            timeout 600 ./vkt-build/vdp_compare "$f" > st.log 2>&1
            echo "::notice title=State $(basename "$f") (rc=$?)::$(head -c 60000 st.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
          done
