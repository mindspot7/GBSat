name: Android Lint (manual)

on:
  workflow_dispatch:
  push:
    branches: [android-port]
    paths:
      - '.github/workflows/android-lint.yml'
      - 'apps/android/app/src/**'
      - 'apps/android/app/build.gradle.kts'
      - 'apps/android/gradle/**'
      - 'libs/gbframe'

permissions:
  contents: read

concurrency:
  group: android-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.14.3
          cache-read-only: true

      - name: Install Android SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.31.6"

      - name: Run Android Lint
        working-directory: apps/android
        run: gradle --no-daemon :app:lintDebug :gbframe:lintDebug --stacktrace

      - name: Upload Lint reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gbsat-android-lint-reports
          path: |
            apps/android/app/build/reports/lint-results-*.html
            apps/android/app/build/reports/lint-results-*.xml
            libs/gbframe/gbframe/build/reports/lint-results-*.html
            libs/gbframe/gbframe/build/reports/lint-results-*.xml
          if-no-files-found: warn
          retention-days: 14
