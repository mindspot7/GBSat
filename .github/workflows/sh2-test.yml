name: SH-2 interpreter test

# The chained SH-2 interpreter (SH2::RunChained) must match the plain one: random code run with both, registers and
# work RAM compared (apps/sh2-test). Runs only when the SH-2 code or the test changes.
on:
  workflow_dispatch:
  push:
    branches: [ android-port ]
    paths: [ '.github/workflows/sh2-test.yml', 'apps/sh2-test/**', 'libs/gbsat-core/src/ymir/hw/sh2/**', 'libs/gbsat-core/include/ymir/hw/sh2/**' ]

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build clang
      - name: Build
        run: |
          cmake -S apps/sh2-test -B b -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ > cfg.log 2>&1 \
            && ninja -C b sh2_chain_test > bld.log 2>&1 \
            || { echo "::error title=sh2_chain_test build failed::$( (cat cfg.log bld.log) | grep -m 20 -E 'error' | cut -c1-400 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"; exit 1; }
      - name: Chained interpreter matches the plain one
        run: |
          timeout 900 ./b/sh2_chain_test 500 > sht.log 2>&1
          rc=$?
          echo "::notice title=SH-2 chained interpreter test (rc=$rc)::$(tail -c 4000 sht.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
          exit $rc
