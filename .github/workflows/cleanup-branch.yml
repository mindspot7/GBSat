name: Delete debug-states branch (one-off)
on:
  push:
    branches: [ android-port ]
    paths: [ .github/workflows/cleanup-branch.yml ]
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - run: gh api -X DELETE repos/${{ github.repository }}/git/refs/heads/debug-states || true
        env:
          GH_TOKEN: ${{ github.token }}
