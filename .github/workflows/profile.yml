name: Profiling build

# APK with native symbols for on-device profiling (tools/profile.bat). Same signature as the normal builds, so it
# installs over them. Run manually from the Actions tab.
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Install NDK, CMake and platform
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.31.6" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: 8.14.3 }
      - name: Install DXC
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R microsoft/DirectXShaderCompiler -p 'linux_dxc_*.tar.gz' -D /tmp/dxc
          sudo mkdir -p /opt/dxc && sudo tar -xzf /tmp/dxc/linux_dxc_*.tar.gz -C /opt/dxc
          echo "/opt/dxc/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=/opt/dxc/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.GBSAT_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/gbsat-release.jks"
          echo "GBSAT_KEYSTORE_FILE=$RUNNER_TEMP/gbsat-release.jks" >> "$GITHUB_ENV"
      - name: Version code
        # Same build number as the latest normal APK, so this installs over it (Android refuses lower version codes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(gh api "repos/${{ github.repository }}/actions/workflows/android.yml/runs?branch=android-port&per_page=1" -q '.workflow_runs[0].run_number')
          echo "BUILD_NUMBER=${N:-$GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - name: Build
        working-directory: apps/android
        env:
          GBSAT_KEYSTORE_PASSWORD: ${{ secrets.GBSAT_KEYSTORE_PASSWORD }}
        run: |
          set +e
          export GITHUB_RUN_NUMBER=$BUILD_NUMBER
          gradle --no-daemon assembleRelease -PgbsatProfile --stacktrace > build.log 2>&1; rc=$?
          if [ $rc -ne 0 ]; then
            msg=$( (grep -E "^e: " build.log; grep -E "What went wrong" -A4 build.log) | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=Build errors::$msg"
          fi
          tail -30 build.log; exit $rc
      - name: Name APK
        run: |
          VER=$(tr -d '[:space:]' < apps/android/VERSION)
          cd apps/android/app/build/outputs/apk/release && mv *.apk "GBSat-v${VER}-profile${BUILD_NUMBER}.apk"
      - uses: actions/upload-artifact@v6
        with:
          name: GBSat-profile
          path: apps/android/app/build/outputs/apk/release/*.apk
