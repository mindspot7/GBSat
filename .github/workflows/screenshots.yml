name: README screenshots

on:
  workflow_dispatch:
  push:
    branches: [ android-port ]
    # UI changes too, so a screen that breaks the screenshot test is caught on the same push
    paths: [ 'apps/android/app/src/**', 'libs/gbframe', '.github/workflows/screenshots.yml' ]

# A newer push makes the running render obsolete
concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: UI kit submodule
        run: git submodule update --init libs/gbframe
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Platform
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: 8.14.3 }
      - name: Render screens
        working-directory: apps/android
        run: |
          set +e
          gradle --no-daemon :app:testDebugUnitTest --tests '*ReadmeScreenshots*' --tests '*DeviceScreens*' > t.log 2>&1; rc=$?
          msg=$( (grep -E "^e: |FAILED|Exception|What went wrong" -A2 t.log | head -60) | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          [ -n "$msg" ] && echo "::warning title=Test log::$msg"
          tail -40 t.log; ls -la ../../docs/screenshots || true
          sum=$( (tail -25 t.log; ls ../../docs/screenshots; find app/build -name "TEST-*.xml" -exec grep -h -A30 "<failure" {} + | grep -E "gbsat|failure" | head -20) 2>&1 | cut -c1-250 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          echo "::notice title=Summary::$sum"
          exit $rc
      - uses: actions/upload-artifact@v6
        with:
          name: screenshots
          path: |
            docs/screenshots/*.png
            apps/android/app/build/device-screens/*.png
            apps/android/app/build/reports/tests/
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs/device-screens && cp apps/android/app/build/device-screens/*.png docs/device-screens/ 2>/dev/null || true
          git add docs/screenshots/*.png docs/device-screens && git commit -m "Update README screenshots" && git push || echo "no changes"
