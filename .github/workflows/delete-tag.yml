name: Delete ANGLE tag (one-off)
on:
  push:
    branches: [ android-port ]
    paths: [ '.github/workflows/delete-tag.yml' ]
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: git push origin :refs/tags/angle-android-arm64 || true
